name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# actions/checkout is the only action here, and it is GitHub's own. Toolchains
# come from the rustup preinstalled on every runner.
#
# No build cache: this crate and its dependency tree build in well under a
# minute, which is the same order as restoring and re-uploading one.

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version && cargo --version

      # Tests assert exact counts against this vintage. A mangled checkout
      # should say so plainly rather than surface as a mismatched record total.
      - name: Verify the pinned fixture is intact
        run: |
          expected=414fc527bcc99f4d9f5da099cd4ea8e5ee14bd791dda3ea135f1621ee6d256e0
          file=tests/fixtures/ISO10383_MIC_2026-08-10.csv
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum "$file" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$file" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error file=$file::pinned fixture has changed (got $actual)"
            echo "If intentional, update the hash here and the counts in tests/cli.rs."
            exit 1
          fi

      # The integration tests run the real binary and never reach the network:
      # `network_failure_is_three` points at a refused port on purpose, and
      # `everything_except_fetch_works_offline` proves the rest ignore it.
      #
      # No `cargo test --doc` here, unlike diurn-mic-rs: this crate has only a
      # bin target, doctests run only for lib targets, and cargo treats being
      # asked for them anyway as a hard error rather than a no-op.
      - run: cargo test --locked --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable with rustfmt and clippy
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install 1.85.0
        # Keep in step with rust-version in Cargo.toml. Higher than
        # diurn-mic's 1.82 on purpose: ureq-proto is edition 2024, so this
        # crate cannot build on less. That is acceptable for a binary people
        # install and would not be for a library people depend on.
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version
      - run: cargo +1.85.0 check --locked --all-targets

  smoke:
    name: smoke test the built command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - run: cargo build --locked --release

      # Exercise the command the way a user would, including the exit codes and
      # the promise that stdout carries data and nothing else.
      # GitHub runs these with `bash -e -o pipefail`, which makes the obvious
      # spellings wrong in two ways: `cmd; test $? -eq 1` aborts at `cmd`
      # before the test runs, and `cmd | grep` fails the pipeline when `cmd`
      # exits nonzero even though grep matched. Both are exactly what we want
      # to assert here, so the checks go through helpers that expect failure.
      - name: Offline behaviour and exit codes
        env:
          # Any attempt to download during these commands fails loudly rather
          # than silently succeeding against the real ISO endpoint.
          DIURN_MIC_URL: http://127.0.0.1:1/must-not-be-used.csv
          # Nothing is bundled with the binary, so point discovery at the
          # pinned fixture rather than fetching.
          DIURN_DATA_DIR: tests/fixtures
        run: |
          D=./target/release/diurn

          fail() { echo "::error::$*"; exit 1; }

          # exit_is <want> <label> -- <cmd...>
          exit_is() {
            want=$1; label=$2; shift 3
            got=0
            "$@" >/dev/null 2>&1 || got=$?
            [ "$got" -eq "$want" ] || fail "$label: exited $got, expected $want"
            echo "ok   $label"
          }

          # stdout_jq <label> <filter> -- <cmd...>
          stdout_jq() {
            label=$1; filter=$2; shift 3
            "$@" 2>/dev/null | jq -e "$filter" >/dev/null || fail "$label"
            echo "ok   $label"
          }

          # stderr_has <label> <needle> -- <cmd...>
          stderr_has() {
            label=$1; needle=$2; shift 3
            err=$("$@" 2>&1 >/dev/null) || true
            case "$err" in
              *"$needle"*) echo "ok   $label" ;;
              *) fail "$label: stderr did not contain '$needle'" ;;
            esac
          }

          # A registry is discovered without being named.
          stdout_jq "vintages discovery" '.[0].selected == true' -- \
            $D mic vintages --format json

          # Valid JSON on stdout; provenance stays on stderr.
          stdout_jq "get --segments" 'length > 1' -- \
            $D mic get XNYS --segments --format json
          stdout_jq "list JP active" 'length > 20' -- \
            $D mic list --country JP --status active --format json
          stdout_jq "list --pending" 'length == 35' -- \
            $D mic list --pending --format json

          # A piped default is JSON Lines, one object per line.
          $D mic list --country GB -q | head -1 | jq -e '.mic' >/dev/null
          echo "ok   jsonl default"

          exit_is 0 "success"            -- $D mic get XNYS -q
          exit_is 1 "usage error"        -- $D mic bogus
          exit_is 1 "cal unimplemented"  -- $D cal
          exit_is 3 "network failure"    -- $D mic fetch

          # The paid namespace advertises itself without pretending to work.
          stderr_has "cal advertises key" "DIURN_API_KEY" -- $D cal

          # A fresh install with no registry explains itself.
          DIURN_DATA_DIR=$(mktemp -d) \
            stderr_has "fresh install message" "diurn mic fetch" -- $D mic get XNYS

          # Nothing internal leaks into public help.
          if $D --help | grep -Eq 'lint|replay|ingest|harvest|ops|admin'; then
            fail "internal command names appear in public help"
          fi
          echo "ok   no internal commands in help"

  package:
    name: publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable
        run: |
          rustup update stable --no-self-update
          rustup default stable

      # Possible only now that diurn-mic comes from crates.io: cargo refuses to
      # package a crate carrying a version-less git dependency. Runs on every
      # push so packaging breaks here rather than on release day.
      - run: cargo package --locked

      - name: Fixtures stay out of the package
        run: |
          if cargo package --locked --list | grep -q '^tests/'; then
            echo '::error::test files leaked into the package; check the exclude list in Cargo.toml'
            cargo package --locked --list
            exit 1
          fi
          echo "Package contents:"
          cargo package --locked --list

  publish:
    name: publish to crates.io
    if: github.event_name == 'release'
    needs: [test, lint, msrv, smoke, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable
        run: |
          rustup update stable --no-self-update
          rustup default stable

      # A release tagged v0.2.0 that publishes 0.1.0 is painful to undo:
      # crates.io versions can be yanked but never replaced or reused.
      #
      # The package name is read from the manifest rather than written here.
      # Hardcoding it invites exactly one bug — copying this step between repos
      # and leaving the previous crate's name behind, which selects nothing and
      # compares against an empty string.
      - name: Release tag must match the crate version
        run: |
          meta=$(cargo metadata --format-version 1 --no-deps)
          count=$(echo "$meta" | jq '.packages | length')
          if [ "$count" -ne 1 ]; then
            echo "::error::expected a single package, found $count; update this check"
            exit 1
          fi
          name=$(echo "$meta" | jq -r '.packages[0].name')
          crate=$(echo "$meta" | jq -r '.packages[0].version')
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "::error::release $GITHUB_REF_NAME does not match $name version $crate"
            exit 1
          fi
          echo "publishing $name $crate"

      - name: Publish
        env:
          # Through the environment rather than --token: a command-line
          # argument is visible in the runner's process list.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
