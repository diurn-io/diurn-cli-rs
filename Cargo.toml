[package]
name = "diurn-cli"
version = "0.3.0"
edition = "2021"
# `diurn`, the client crate the calendar commands wrap, is edition 2024 with
# an MSRV of 1.85, so this crate cannot build on anything older. Unlike
# diurn-mic, whose MSRV is a promise to library consumers, this is a binary
# people install; a current toolchain is a reasonable ask.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Command-line tool for ISO 10383 Market Identifier Codes and Diurn market calendars"
repository = "https://github.com/diurn-io/diurn-cli-rs"
homepage = "https://diurn.io"
readme = "README.md"
keywords = ["mic", "iso10383", "exchange", "finance", "cli"]
categories = ["command-line-utilities", "finance"]
exclude = ["tests/**", ".github/**"]

# The crate is `diurn-cli` but the command is `diurn`. Precedent: ripgrep ships
# `rg`. The name `diurn` on crates.io belongs to the client library, which is
# what people write in a `use` statement.
[[bin]]
name = "diurn"
path = "src/main.rs"

[dependencies]
diurn-mic = "0.2.0"

anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
csv = "1.4"
jiff = { version = "0.2", default-features = false, features = ["std", "alloc", "serde", "tz-system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The calendar commands are a thin wrapper over the `diurn` client crate
# (SPEC 2.1): no HTTP of their own. Its blocking client, since this is a
# program without an async runtime.
diurn = { version = "0.1", features = ["blocking"] }
# `mic fetch` downloads the registry with the same reqwest the client uses,
# so the binary carries one HTTP and TLS stack. Every other `mic` command
# works with the network unplugged.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
